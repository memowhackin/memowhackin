<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110f2a" />
    <meta
      name="description"
      content="AssistSec — AI-assisted penetration testing. Europe's most experienced pentesters, backed by autonomous agents."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg" />

    <!--
      Fonts are linked here, not @import-ed from index.css: the browser can
      only discover an @import after the importing sheet has arrived, which
      puts two round trips in series ahead of the first painted glyph.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!--
      Share cards. The site sends people to LinkedIn, and a link to it there (or
      in Slack, or anywhere else that unfurls) rendered as a bare URL without
      these. og:image wants a 1200×630 export that does not exist yet; until one
      does, the card falls back to a title-and-description unfurl rather than
      pointing at an asset of the wrong shape.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AssistSec" />
    <meta property="og:title" content="AssistSec — AI-assisted pentesting" />
    <meta
      property="og:description"
      content="AI-assisted penetration testing. Europe's most experienced pentesters, backed by autonomous agents."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AssistSec — AI-assisted pentesting" />
    <meta
      name="twitter:description"
      content="AI-assisted penetration testing. Europe's most experienced pentesters, backed by autonomous agents."
    />

    <title>AssistSec — AI-assisted pentesting</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

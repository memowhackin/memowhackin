server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded blog images can be large; everything else here is small.
    client_max_body_size 10m;

    # The app is a single-page bundle plus a JSON API. Nothing loads from
    # anywhere else, so the policy can be strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # The API lives behind the same origin as the site, which is why the browser
    # never makes a cross-origin request in this deployment: no CORS preflight,
    # and the session cookie is plain first-party.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # NOTE on the repeated add_header lines below: nginx does not merge them.
    # A location that sets any add_header REPLACES every header inherited from
    # the server block, so a location adding only Cache-Control would silently
    # ship without the four security headers above. They are repeated in each
    # block that adds a header of its own.

    # Build output only: Vite writes a content hash into these filenames, so a
    # given URL can never change and a year is safe.
    #
    # Regex rather than a `location /assets/` prefix, and ordered before the
    # locale rule, because nginx prefers a matching regex over a prefix — a
    # prefix here would lose /nl/assets/* to the locale block below and leave
    # the entire translated bundle uncached.
    #
    # The quotes are load-bearing on every regex location in this file: nginx
    # ends an unquoted token at `{`, so a bare `[a-z]{2}` truncates the pattern
    # and the config fails to compile — the container then crash-loops at boot.
    location ~ "^(/[a-z]{2})?/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Everything else under /assets/ comes from public/ — logos, badges, video.
    # Those names carry no hash and are replaced in place, so marking them
    # immutable for a year means a swapped logo takes a year to reach anyone who
    # has already visited.
    location ~ "^(/[a-z]{2})?/assets/" {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous build's asset URLs, which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Translated builds live under a language prefix and must fall back to their
    # OWN shell — sending /nl/about to /index.html loads the English bundle at a
    # Dutch URL. Matched by shape rather than by a list of languages, so adding
    # one needs no change here. `=404` keeps a two-letter path that is not a
    # language from silently serving the site root.
    #
    # no-cache for the same reason as /index.html: everything served here is
    # either a prerendered page or the shell, and a cached copy from before a
    # deploy points at hashed asset URLs that no longer exist.
    location ~ "^/(?<sitelocale>[a-z]{2})/" {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /$sitelocale/index.html =404;
    }

    # Client-side routing: any unmatched path is a route, not a missing file.
    # This is what dist/_redirects expresses on Cloudflare Pages / Netlify.
    #
    # no-cache covers every prerendered <route>/index.html — /about, /blog and
    # each article — which the exact-match rule above cannot reach. The stray
    # root files that also land here (robots.txt, sitemap.xml, the feeds) are
    # tiny and revalidate with a 304, so nothing meaningful is lost.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}

# Lint, format, typecheck, unit tests, build, e2e.
#
# Node is pinned to `latest` rather than a major: this is a static front end with
# a lockfile, and tracking the newest release surfaces engine breakage here
# instead of on someone's machine. If a Node release ever breaks a build that
# should have passed, pin the major here and the failure is explained.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the token gets read-only scope.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt:check

      # `npm run build` runs `tsc -b` first, so this covers typechecking too.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - run: npm ci

      # The browser download is the slowest step in this job and only changes
      # when Playwright itself does, so it is keyed on the installed version.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Playwright starts the server itself (see playwright.config.ts), and the
      # suite only has a chromium project, so the other browsers are dead
      # download weight. The cache holds the browser but not the apt packages it
      # links against, so those are installed either way.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

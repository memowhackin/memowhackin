# Minimal CI for the frontend template: lint, test, build.
# Extend with your own deploy stage (S3/CloudFront, container, etc.) per project.
stages:
  - lint
  - test
  - build

default:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci

lint:
  stage: lint
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm run test

e2e:
  stage: test
  # Playwright's image ships the browsers + system deps. Keep the tag in sync
  # with the @playwright/test version in package.json.
  image: mcr.microsoft.com/playwright:v1.50.0-noble
  script:
    - npx playwright test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    name: "frontend-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 7 days
